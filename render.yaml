databases:
  - name: urban-air-quality-db
    databaseName: airquality
    user: airquality
    plan: free

services:
  - type: web
    name: urban-air-quality-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-render.txt
    startCommand: streamlit run dashboard/app.py --server.address 0.0.0.0 --server.port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: urban-air-quality-db
          property: connectionString

  - type: cron
    name: urban-air-quality-etl
    runtime: python
    schedule: "30 3 * * *"
    buildCommand: pip install -r requirements-render.txt
    startCommand: python run_render_pipeline.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: urban-air-quality-db
          property: connectionString
      - key: XKDR_API_KEY
        sync: false
