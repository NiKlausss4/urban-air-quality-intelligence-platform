name: CI
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: airquality
          POSTGRES_USER: airquality
          POSTGRES_PASSWORD: airquality
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U airquality"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://airquality:airquality@localhost:5432/airquality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-windows.txt
      - run: pip install -r requirements-windows.txt
      - run: python -m compileall -q src dashboard airflow/dags
      - run: python -m pytest -q
